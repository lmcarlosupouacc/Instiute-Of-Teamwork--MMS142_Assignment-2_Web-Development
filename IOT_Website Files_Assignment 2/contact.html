<!DOCTYPE html>
<!--
    CONTACT PAGE
    Visitors fill in the form to send an inquiry to the store.
-->
<!-- Ensures all elements use English as the default language -->
<html lang="en">
<head>
    <!-- Tells the webpage to use UTF-8 character encoding -->
    <meta charset="UTF-8">
    <!-- Ensures the page displays properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Text shown on the browser tab -->
    <title>Contact Us | Memasuot</title>

    <!-- Loads the Fredoka (headings/buttons), Plus Jakarta Sans (body text) and Noto Sans Tagalog (Baybayin) fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Tagalog&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Loads the CSS file -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<!-- Uses the background color set by the CSS file -->
<body style="background-color: var(--bg-about)">
    <!-- Allows keyboard users to skip past the navbar when pressing Tab -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- HEADER / NAVBAR -->
    <header>
        <!--
            Uses a sticky Bootstrap navbar to keep the navigation bar visible at the top.
            Uses a hamburger menu style on small screens.
        -->
        <nav class="navbar navbar-expand-lg site-navbar sticky-top" aria-label="Primary Navigation">
            <div class="container">

                <!-- Logo that links back to the home page when pressed -->
                <a class="navbar-brand" href="index.html" aria-label="Memasuot Home">
                    <!--
                        Loads the Memasuot logo.
                        Shows the "logo-fallback" text if the logo can't be loaded.
                    -->
                    <img src="images/logo.png" alt="Memasuot orange oval brand logo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';">
                    <span class="logo-fallback" style="display:none;" aria-hidden="true">
                        memasuot
                        <!-- Marks the text as Tagalog -->
                        <span lang="fil-Tglg">ᜋᜒᜋᜐᜓᜂᜆ᜔</span>
                    </span>
                </a>

                <!-- Creates the hamburger style menu button for smaller screens -->
                <button class="navbar-toggler border-warning" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation menu">
                    <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
                </button>

                <!-- Creates the collapsible links for the hamburger menu -->
                <div class="collapse navbar-collapse justify-content-end" id="mainNav">
                    <!-- Creates the links used by both menu styles -->
                    <ul class="navbar-nav gap-lg-4">
                        <li class="nav-item">
                            <!-- Links the user to the Home page -->
                            <a class="nav-link " href="index.html" >Home</a>
                        </li>
                        <li class="nav-item">
                            <!-- Links the user to the Shop section of the Home page -->
                            <a class="nav-link " href="index.html#shop">Shop</a>
                        </li>
                        <li class="nav-item">
                            <!-- Links the user to the About section of the Home page -->
                            <a class="nav-link" href="index.html#about">About</a>
                        </li>
                        <li class="nav-item">
                            <!-- "active" and aria-current mark the page the visitor is on -->
                            <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main-content" class="content-surface">
        <div class="container">
            <!-- Page heading and short welcome message -->
            <h1 style="text-align: center; font-family: var(--font-display); color: var(--accent-orange);">Contact Us!</h1>
            <p class="text-center mb-1" style="color: var(--text-cream);">If you have any inquiries, or just want to say "Hello!"</p>
            <p class="text-center mb-4" style="color: var(--text-cream);">Send us a message and we'll get back to you as soon as possible!</p>

            <!-- Card that holds the form -->
            <div class="form-card">
                <!--
                    Once the user presses submit, calls in the submitContactForm() function from the main.js file to open the
                    visitor's email app with their information and message written, addressed to hello@examplewebsite142.com.
                -->
                <form onsubmit="submitContactForm(event)">
                    <div class="mb-3">
                        <!-- Visitor's Full Name -->
                        <label for="name" class="form-label">Full Name</label>
                        <!-- "required" makes the browser stop empty submissions -->
                        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                    </div>
                    <div class="mb-3">

                        <!-- Visitor's Email -->
                        <label for="email" class="form-label">Email Address</label>
                        <!-- Checks if the text is an email format -->
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">

                        <!-- Visitor's Subject of Message -->
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" id="subject" name="subject" class="form-control" placeholder="Enter the subject" required>
                    </div>
                    <div class="mb-4">

                        <!-- Visitor's Message -->
                        <label for="message" class="form-label">Your Message</label>
                        <!-- A textarea is used because messages are longer; rows="5" sets its starting height -->
                        <textarea id="message" name="message" class="form-control" rows="5" placeholder="Write your message here" required></textarea>
                    </div>

                    <!-- Pressing the Send Message button triggers the form's submit event -->
                    <button type="submit" class="btn-cta-olive w-100">Send Message</button>
                    <!-- Feedback message; stays hidden (d-none) until it needs to be shown, and aria-live lets screen readers announce it -->
                    <div id="contactFeedback" class="alert alert-info mt-3 d-none" role="status" aria-live="polite"></div>
                </form>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <!-- Copyright notice -->
            <div>All rights reserved @ Copyright 2026 Memasuot</div>
            <!-- Links to the legal page -->
            <div class="d-flex gap-4">
                <a href="privacy-policy.html#terms">Terms and Conditions</a>
                <a href="privacy-policy.html">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Loads our own JavaScript for the page's interactive features -->
    <script src="js/main.js"></script>
</body>
</html>
